
<!DOCTYPE html>
<html>
<head>
    <title>ReNewMarket</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f3;
            margin: 0;
        }
        header {
            background: #176b45;
            color: white;
            padding: 18px;
            text-align: center;
        }
        nav {
            background: #dceee3;
            padding: 12px;
            text-align: center;
        }
        nav button, button {
            padding: 8px 12px;
            margin: 4px;
            cursor: pointer;
            background: #176b45;
            color: white;
            border: none;
            border-radius: 4px;
        }
        .container {
            background: white;
            padding: 20px;
            margin: 20px auto;
            max-width: 900px;
            border-radius: 8px;
        }
        input, select {
            padding: 9px;
            margin: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
        th { background: #dceee3; }
        .hidden { display: none; }
    </style>
</head>
<body>

<header>
    <h1>ReNewMarket</h1>
    <p>Buy, Sell, Reuse</p>
</header>

<div class="container" id="login">
    <h2>Admin Login</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="loginAdmin()">Login</button>
    <p id="loginMsg"></p>
    <small>Demo login: admin / admin123</small>
</div>

<div id="dashboard" class="hidden">
    <nav>
        <button onclick="showSection('users')">User Management</button>
        <button onclick="showSection('categories')">Category Management</button>
        <button onclick="showSection('products')">Commodity Management</button>
        <button onclick="showSection('orders')">Order Management</button>
        <button onclick="logout()">Logout</button>
    </nav>

    <div class="container" id="users">
        <h2>User Management</h2>
        <input id="userName" placeholder="User name">
        <input id="userEmail" placeholder="Email">
        <button onclick="addUser()">Add User</button>
        <table>
            <thead><tr><th>Name</th><th>Email</th><th>Action</th></tr></thead>
            <tbody id="userList"></tbody>
        </table>
    </div>

    <div class="container hidden" id="categories">
        <h2>Category Management</h2>
        <input id="categoryName" placeholder="Category name">
        <button onclick="addCategory()">Add Category</button>
        <table>
            <thead><tr><th>Category</th><th>Action</th></tr></thead>
            <tbody id="categoryList"></tbody>
        </table>
    </div>

    <div class="container hidden" id="products">
        <h2>Commodity Management</h2>
        <input id="productName" placeholder="Product name">
        <input id="productPrice" type="number" min="0.01" step="0.01" placeholder="Price (₹)">
        <select id="productCategory">
            <option value="">Select category</option>
        </select>
        <button onclick="addProduct()">Add Product</button>
        <table>
            <thead><tr><th>Product</th><th>Price</th><th>Category</th><th>Action</th></tr></thead>
            <tbody id="productList"></tbody>
        </table>
    </div>

    <div class="container hidden" id="orders">
        <h2>Order Management</h2>
        <input id="orderProduct" placeholder="Product name">
        <input id="orderCustomer" placeholder="Customer name">
        <button onclick="addOrder()">Add Order</button>
        <table>
            <thead><tr><th>Product</th><th>Customer</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="orderList"></tbody>
        </table>
    </div>
</div>

<script>
    let users = [];
    let categories = ["Electronics", "Furniture", "Clothing", "Collectibles"];
    let products = [];
    let orders = [];

    function loginAdmin() {
        let u = document.getElementById("username").value;
        let p = document.getElementById("password").value;

        if (u === "admin" && p === "admin123") {
            document.getElementById("login").classList.add("hidden");
            document.getElementById("dashboard").classList.remove("hidden");
            renderAll();
        } else {
            document.getElementById("loginMsg").textContent =
                "Invalid username or password.";
        }
    }

    function logout() {
        document.getElementById("dashboard").classList.add("hidden");
        document.getElementById("login").classList.remove("hidden");
        document.getElementById("password").value = "";
    }

    function showSection(id) {
        ["users", "categories", "products", "orders"].forEach(s =>
            document.getElementById(s).classList.toggle("hidden", s !== id)
        );
    }

    function addUser() {
        let name = document.getElementById("userName").value.trim();
        let email = document.getElementById("userEmail").value.trim();

        if (!name || !email || !email.includes("@")) {
            alert("Enter a valid name and email.");
            return;
        }

        users.push({name, email});
        document.getElementById("userName").value = "";
        document.getElementById("userEmail").value = "";
        renderUsers();
    }

    function deleteUser(i) {
        users.splice(i, 1);
        renderUsers();
    }

    function addCategory() {
        let name = document.getElementById("categoryName").value.trim();
        if (!name) return alert("Enter a category name.");
        if (categories.some(c => c.toLowerCase() === name.toLowerCase()))
            return alert("Category already exists.");

        categories.push(name);
        document.getElementById("categoryName").value = "";
        renderCategories();
    }

    function deleteCategory(i) {
        if (products.some(p => p.category === categories[i]))
            return alert("Delete or reassign products in this category first.");

        categories.splice(i, 1);
        renderCategories();
    }

    function addProduct() {
        let name = document.getElementById("productName").value.trim();
        let price = Number(document.getElementById("productPrice").value);
        let category = document.getElementById("productCategory").value;

        if (!name || !category || !Number.isFinite(price) || price <= 0)
            return alert("Enter a product, valid price, and category.");

        products.push({name, price, category});
        document.getElementById("productName").value = "";
        document.getElementById("productPrice").value = "";
        renderProducts();
    }

    function editProduct(i) {
        let p = products[i];
        let name = prompt("Enter product name:", p.name);
        if (name === null) return;
        let price = prompt("Enter price:", p.price);
        if (price === null) return;

        name = name.trim();
        price = Number(price);

        if (!name || !Number.isFinite(price) || price <= 0)
            return alert("Enter a valid name and positive price.");

        p.name = name;
        p.price = price;
        renderProducts();
    }

    function deleteProduct(i) {
        products.splice(i, 1);
        renderProducts();
    }

    function addOrder() {
        let product = document.getElementById("orderProduct").value.trim();
        let customer = document.getElementById("orderCustomer").value.trim();

        if (!product || !customer)
            return alert("Enter product and customer names.");

        orders.push({product, customer, status: "Shipped"});
        document.getElementById("orderProduct").value = "";
        document.getElementById("orderCustomer").value = "";
        renderOrders();
    }

    function changeStatus(i, status) {
        orders[i].status = status;
        renderOrders();
    }

    function deleteOrder(i) {
        orders.splice(i, 1);
        renderOrders();
    }

    function renderUsers() {
        document.getElementById("userList").innerHTML = users.map((u, i) =>
            `<tr><td>${escapeHTML(u.name)}</td>
            <td>${escapeHTML(u.email)}</td>
            <td><button onclick="deleteUser(${i})">Delete</button></td></tr>`
        ).join("");
    }

    function renderCategories() {
        document.getElementById("categoryList").innerHTML = categories.map((c, i) =>
            `<tr><td>${escapeHTML(c)}</td>
            <td><button onclick="deleteCategory(${i})">Delete</button></td></tr>`
        ).join("");

        document.getElementById("productCategory").innerHTML =
            '<option value="">Select category</option>' +
            categories.map(c =>
                `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`
            ).join("");
    }

    function renderProducts() {
        document.getElementById("productList").innerHTML = products.map((p, i) =>
            `<tr><td>${escapeHTML(p.name)}</td>
            <td>₹${p.price.toFixed(2)}</td>
            <td>${escapeHTML(p.category)}</td>
            <td><button onclick="editProduct(${i})">Edit</button>
            <button onclick="deleteProduct(${i})">Delete</button></td></tr>`
        ).join("");
    }

    function renderOrders() {
        document.getElementById("orderList").innerHTML = orders.map((o, i) =>
            `<tr><td>${escapeHTML(o.product)}</td>
            <td>${escapeHTML(o.customer)}</td>
            <td><select onchange="changeStatus(${i}, this.value)">
                <option ${o.status === "Shipped" ? "selected" : ""}>Shipped</option>
                <option ${o.status === "Received" ? "selected" : ""}>Received</option>
            </select></td>
            <td><button onclick="deleteOrder(${i})">Delete</button></td></tr>`
        ).join("");
    }

    function renderAll() {
        renderUsers();
        renderCategories();
        renderProducts();
        renderOrders();
    }

    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, c => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;",
            '"': "&quot;", "'": "&#39;"
        }[c]));
    }
</script>

</body>
</html>
